name: FlakeGuard AI Workflow

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  install-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  model-training:
    runs-on: ubuntu-latest
    needs: install-dependencies

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4

        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run model training
        run: python src/train_model.py

  flaky-prediction:
    runs-on: ubuntu-latest
    needs: model-training

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4

        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flaky prediction
        run: python src/predictor.py

  upload-reports:
    runs-on: ubuntu-latest
    needs: flaky-prediction

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Upload reports
        uses: actions/upload-artifact@v4

        with:
          name: flaky-test-reports
          path: reports/